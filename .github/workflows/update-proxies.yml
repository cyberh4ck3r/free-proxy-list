name: Update Proxies

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install deps
        run: npm ci || npm install

      - name: Fetch proxies
        run: node scripts/fetch-proxies.mjs

      - name: Health check + filter (fast/stable/elite)
        run: node scripts/check-proxies.mjs
        timeout-minutes: 20

      - name: Update README counts
        run: node scripts/update-readme-counts.mjs

      - name: Build commit message
        id: msg
        run: |
          HTTP=$(wc -l < proxies/unchecked/http-proxies.txt 2>/dev/null || wc -l < http-proxies.txt 2>/dev/null || echo 0)
          HTTPS=$(wc -l < proxies/unchecked/https-proxies.txt 2>/dev/null || wc -l < https-proxies.txt 2>/dev/null || echo 0)
          S4=$(wc -l < proxies/unchecked/socks4-proxies.txt 2>/dev/null || wc -l < socks4-proxies.txt 2>/dev/null || echo 0)
          S5=$(wc -l < proxies/unchecked/socks5-proxies.txt 2>/dev/null || wc -l < socks5-proxies.txt 2>/dev/null || echo 0)
          FAST=$(wc -l < proxies/checked/latency/fast/fast-proxies.txt 2>/dev/null || echo 0)
          STABLE=$(wc -l < proxies/checked/stability/stable/stable-proxies.txt 2>/dev/null || echo 0)
          ELITE=$(wc -l < proxies/checked/anonymity/elite/elite-proxies.txt 2>/dev/null || echo 0)
          HEALTHY=$(wc -l < proxies/checked/all/all-proxies.txt 2>/dev/null || echo 0)
          echo "message=update proxy lists - HTTP: $HTTP, HTTPS: $HTTPS, SOCKS4: $S4, SOCKS5: $S5 | healthy: $HEALTHY, fast: $FAST, stable: $STABLE, elite: $ELITE" >> $GITHUB_OUTPUT

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ steps.msg.outputs.message }}
          file_pattern: |
            proxies/unchecked/*.txt
            proxies/checked/**/*.txt
            proxies/checked/**/*.json
            proxies/**/*.json
            stats/*.json
            README.md
